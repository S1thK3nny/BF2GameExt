// ---------------------------------------------------------------------------
// BF2GameExt tutorial: loading screen team models
// See docs/tutorials/loading-screen-team-models.md
//
// BEFORE YOU MUNGE: replace the map ID in the Map() block below with your own.
// "ABCg_con" means world ABC, GCW era, conquest mode - the same string the
// mission script is named after.
// ---------------------------------------------------------------------------

LoadDisplay()
{
	// --- Stock BF2 keys, unchanged from the shipped load.cfg ---------------
	LoadingTextBlinkRate(1);
	LoadingTextColorPallete()
	{
		Color(200, 200, 200, 75);
		Color(200, 200, 255, 200);
	}

	TipsBoxTexture("loadtipsbox_pieces", 12.0, 12.0);
	TipsColor(155, 171, 207, 210);
	TipsPrefix("level.common.tips");
	TipsTime(10);
	ProgressBarLEDColor(200, 200, 200, 255);
	ProgressBarLEDMinIntensity(0.300000);
	ProgressBarLEDTexture("loading");
	ProgressBarLEDHeight(20);
	ProgressBarLEDWidth(20);
	ProgressBarLEDSpacing(0.500000);
	ProgressBarNumLEDs(12);
	ProgressBarTotalTime(10);
	RandomBackdrop("load\common");
	AmbientColor(0, 0, 0);
	SunColor(255, 255, 255);
	SunDirection(0.705000, -0.078000, -0.705000);

	// --- Team models -------------------------------------------------------
	// Set here, these apply to EVERY map that uses this load.lvl.  Any of the
	// four keys can be repeated in a Map() block to override them for one map.
	//
	// "1" and "2" are screen SLOTS, not teams.  They must be quoted!

	TeamModel("1", "com_icon_imperial_load");
	TeamModel("2", "com_icon_alliance_load");

	TeamModelScale(90);
	TeamModelRotationSpeed(2.0);

	// x, y are screen fractions from the TOP LEFT: +x right, +y down.
	// (0.5, 0.5) is dead centre.
	TeamModelOffset("1", 0.125, 0.15);
	TeamModelOffset("2", 0.875, 0.85);
}

Map("ABCg_con")
{
	// Per-map override. Removing the tooltips because it doesnt work well with our loading screen.
	RemoveToolTips(1);

	ProgressBarTotalTime(12);
}
