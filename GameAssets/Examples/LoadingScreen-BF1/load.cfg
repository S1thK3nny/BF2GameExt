// ---------------------------------------------------------------------------
// BF2GameExt tutorial: BF1-style loading screen
// See docs/tutorials/loading-screen-bf1.md
//
// BEFORE YOU MUNGE: replace the map IDs in the Map() blocks below with your own
// ---------------------------------------------------------------------------

LoadDisplay()
{
	// --- Stock BF2 keys, unchanged from the shipped load.cfg ---------------
	LoadingTextBlinkRate(1);
	LoadingTextColorPallete()
	{
		Color(200, 200, 200, 75);
		Color(200, 200, 255, 200);
	}

	TipsBoxTexture("loadtipsbox_pieces", 12.0, 12.0);
	TipsColor(155, 171, 207, 210);
	TipsPrefix("level.common.tips");
	TipsTime(10);
	ProgressBarLEDColor(200, 200, 200, 255);
	ProgressBarLEDMinIntensity(0.300000);
	ProgressBarLEDTexture("loading");
	ProgressBarLEDHeight(20);
	ProgressBarLEDWidth(20);
	ProgressBarLEDSpacing(0.500000);
	ProgressBarNumLEDs(12);
	ProgressBarTotalTime(10);
	RandomBackdrop("load\common");
	AmbientColor(0, 0, 0);
	SunColor(255, 255, 255);
	SunDirection(0.705000, -0.078000, -0.705000);

	// --- BF1 sequence ------------------------------------------------------
	// Master switch.  Without it every key below is parsed and thrown away.
	EnableBF1(1);

	// The 16-quad crosshair frame that closes in on the zoom target.
	ZoomSelectorTextures("load_edge_horz", "load_edge_vert", "load_edge_corner");

	// The BF1 loading sounds are still in the retail game, in the stock
	// data\_lvl_pc\core.lvl, which stays resident for the whole session, naming them is all it takes. 
	// LoadSoundLVL is only needed for sounds of your OWN, and is left commented out here for that reason.
	//LoadSoundLVL("dc:sound\\myloadsounds.lvl");

	XTrackingSound("load_xtracking");
	YTrackingSound("load_ytracking");
	ZoomSound("load_zoom");
	TransitionSound("load_transition");
	BarSound("load_bar");
	BarSoundInterval(1);

	// BF1 had no tips box and no LED bar on this screen.
	RemoveToolTips(1);
	RemoveLoadingBar(1);
}

Map("ABCc_con")
{
	PC()
	{
		// PlanetLevel(n, "texturename", x, y, w, h)
		//
		// Four levels, zoomed into in order: galaxy -> planet -> region ->
		// the map itself.  x and y are the TOP LEFT corner of the zoom
		// selector, w and h its width and height.  All four are fractions of
		// the backdrop, NOT pixels, so BF1s own numbers cannot be copied in
		// directly - divide them by the source image size first.
		//
		// Worked example, a 1920x1080 backdrop with the target at
		// [1152, 108] to [1728, 594]:
		//   x = 1152 / 1920 = 0.600
		//   y =  108 / 1080 = 0.100
		//   w =  576 / 1920 = 0.300   (1728 - 1152)
		//   h =  486 / 1080 = 0.450   (594 - 108)
		//
		// The last level is the destination, so its rect is all zeroes.

		PlanetLevel(0, "load_galacticmap_0",       0.380859375,  0.7197265625, 0.0361328125, 0.0419921875)
		PlanetLevel(1, "load_locale_Geonosis_1",   0.3515625,    0.5419921875, 0.037109375,  0.0361328125)
		PlanetLevel(2, "load_landsat_Geonosis_2",  0.3515625,    0.5419921875, 0.037109375,  0.0361328125)
		PlanetLevel(3, "load_level_Geonosis_3",    0,            0,            0,            0)
	}
}

Map("ABCg_con")
{
	// Everything set in LoadDisplay() can be turned back off per map, so one
	// load.lvl can serve BF1-style maps and ordinary ones side by side.
	EnableBF1(0);
	RemoveToolTips(0);
	RemoveLoadingBar(0);
}
