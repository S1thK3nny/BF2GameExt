; BF2GameExt.ini - auto-generated by generate_ini.py for v1.0.0
; To regenerate, run python generate_ini.py

[General]
; Master enable/disable switch for BF2GameExt
Enabled=1
; Path to the main extension DLL (relative to proxy)
DLLPath=BF2GameExt.dll

[LimitIncreases]
; Stop killing soldiers that go above world height 1000. Stock BF2 kills any soldier whose Y passes 1000 - including on spawn - which caps how tall a map can be. Flyers were never affected: the check exists only in the soldier update. The floor at -1000, the fall-speed kill and the +/-2500 horizontal walls are left alone. Cost: a soldier that genuinely escapes upward is never cleaned up and keeps ticking. Set 1 to enable
SoldierHeightCeiling=0
; How many AI reservation claims may be held at once. Squads book vehicle seats, repair points, attack slots and formation positions through a single 60-entry pool, and once it is full every further claim is dropped - the unit keeps re-requesting it and the log fills with "List pool is full". 127 is the encoding ceiling, a little over double the room, and costs 1.6 KB. Set 60 for stock. The figure that warning asks for is not real demand: it counts rejected claims since the map loaded
ReservationPoolSize=127
; Extend RedMemory heap size
HeapExtension=1
; Raise SoundParameterized layer limit
SoundLayerLimit=1
; Raise DLC / addon mission limit
DLCMissionLimit=1
; Raise global sound limit
SoundLimit=1
; Raise entity / object pool limit
ObjectLimitIncrease=1
; Raise combo animation limit
ComboAnimIncrease=1
; Raise high-resolution animation limit
HighResAnimLimit=1
; Raise the input/voice-chat update tick from 30 Hz to 120 Hz (the simulation tick is untouched)
NetworkTimerIncrease=1
; Extend matrix / item pool size
MatrixPoolIncrease=1
; Increase string pool size
StringPoolIncrease=1
; How many sounds may be audible at once. 0 keeps the stock limit of 32. Otherwise a count from 33 to 119; the engine's own probe, voice pool and two ceilings are all raised to match. Works in both mixing paths: under EAX (5.1/7.1 or an audio mode that selects DirectSound hardware) the extra voices are hardware buffers and DirectSound must have some to spare, while software mixing needs nothing external but costs more CPU per voice. Costs 1.4 KB per voice
VoiceLimit=0
; Raise how many sounds can stream at the same time from 6 to 12. Uses more memory
AudioStreamLimit=1
; Troops and props snap to their blurry low-detail models as soon as a fight gets crowded. Keeps roughly twenty times as many of them at full detail
LODLimitExtension=1
; Explosions more than a short way off were not drawn at all, so distant fighting looked empty. Makes them visible across the map
ExplosionVisibleRadius=1
; Raise Galactic Conquest galaxy-map pathway/particle draw limits (fixes missing pathways and icons with >13 planets)
GCVisualLimits=1

[Particles]
; Fix the particle engine: use all the batch caches, stop a full batch from deleting whole effects for a frame, and stop one failed frame from disabling particles for good. Turn off only to compare against stock behaviour
ParticleFixes=1
; How many particles effects are allowed to show. 0 = stock, 1 = balanced (full density near and mid-range, stock thinning far away, and effects that ask for more than 128 particles get them), 2 = maximum (no thinning with distance at all). Higher costs frame time
ParticleDensity=0

[Fixes]
; Let explosions push bodies that break into chunks, instead of dropping them where they stood
ChunkPushFix=1
; Fix foliage-update crash at very high FOVs (PrismaticFlower's fix)
PropGeneratorLoopFix=1
; Raise the SkyObjectClass instance limit (PrismaticFlower's fix)
SkyObjectLimit=1
; Let lightsabers block other lightsabers from any direction. In stock BF2 a saber block only registers while you happen to be aiming at the centre of the map. Set 0 for stock
SaberBlockFix=1
; Make EntityPath branch regions work. The engine calls the wrong vtable slot so no branch region is ever created, and derives the region id from one character too early. Name the region "entitypathbranch <id>" and write BranchRegion("<id>") in the path node
BranchRegionFix=1
; Impact sounds play below world height 0. Stock BF2 compares the impact height against the water surface to choose between the water and generic impact sounds, but on a map with no water it reads an uninitialised value that happens to be just above zero, so everything below Y=0 is silent. Seeds the value properly; maps that do have water still suppress the generic sound underwater. Set 0 for stock
ImpactSoundWaterFix=1
; A memory pool binds to whichever heap was current when it was constructed, and grows from that heap forever. Pools built during level load bind to the temporary load heap, which is wiped at the end of every load - so the first time such a pool grows it hands out pointers into released memory and the game crashes. This points a pool at the heap that is actually live before it grows. A mission script can avoid the problem with SetMemoryPool, but only if you have the script; this covers maps whose source is lost
MemoryPoolHeapFix=1
; Survive a mission script pointing command post logic at something that is not a command post. Stock BF2 dereferences the null and crashes; this logs what happened and keeps playing
CommandPostNullFix=1
; A model may carry 64 attached effects. Past that the engine prints its own warning and then counts the effect anyway without storing it, so the class is built from 64 real entries plus whatever memory sits after the array, and the level dies on a null read while spawning them. The extra effects are now refused cleanly, which is exactly what the retail builds already do - their compiler dropped the same stray write. Nothing changes for a model within the limit. Modtools only
AttachedEffectsOverflowFix=1
; Re-resolve terrain detail/white textures each map (fixes playlist crash; PrismaticFlower's fix)
TerrainTextureFix=1
; Fire projectiles from barrel hardpoint instead of bone_head. HINT: firing from the barrel adds barrel-to-crosshair parallax, so shots may not land exactly on the reticle once ReticleCorrection re-aligns it to the 3D aim point (worst at close range and with large weapon offsets). Set ReticleCorrection=0 if barrel-origin shots feel off-point
BarrelFireOriginFix=1
; Clamp blur effect downsize resolution to 512px at high resolutions (PrismaticFlower's fix)
BlurDownsizeClamp=1
; Replace the broken Print Screen handler on retail builds (PrismaticFlower's fix)
ScreenshotFix=1
; Restore fatal-error dialogs on retail builds via a template in BF2GameExt.dll (PrismaticFlower's fix)
ErrorDialogFix=1
; EXPERIMENTAL: initialize the DLC mission list when launching a mission from the commandline (PrismaticFlower's fix; not yet working on retail, keep off)
DLCMissionInitFix=0
; Let droidekas play their death animation (death01) instead of exploding instantly; banks without one are unaffected
DroidekaDeathAnimation=1
; HUD widescreen reticle vertical alignment: -1 auto (scales with aspect ratio), 0 to disable, or a manual strength 0..1 (full letterbox undo at 1)
ReticleCorrection=-1

[Features]
; Enable prone stance. Requires data\_lvl_pc\prone.lvl, which is loaded automatically alongside every ingame.lvl read; prone stays off for any mission where that file is missing
Prone=1
; Enable the engine's BFront2.log file logging on retail builds
GameLogging=0
; Log 'Unable to find sound property' warnings for missing sounds (modtools only)
EnableSoundWarnings=0
; Remove the permanent combat-award buffs. Buffs from officer buff weapons and buff pickups are untouched. The technician's award weapon goes with its passive
DisableAwardBuffs=0
; Remove the combat-award weapons. Set alongside DisableAwardBuffs to disable all nine awards
DisableAwardWeapons=0
; Stop AI from shooting dead bodies entirely (overrides DeadBodyShootingAllFactions)
DisableDeadBodyShooting=1
; Let all factions shoot dead bodies, not just Alliance (ignored if DisableDeadBodyShooting=1)
DeadBodyShootingAllFactions=0

[Lightsaber]
; Ignited lightsaber blades give off real light in their own blade colour. Objects can only take 4 dynamic lights at once, so a nearby saber can replace one of a room's own lights. Set 0 for stock
LightsaberIllumination=1
; How far the lightsaber light reaches, in metres at full blade extension (it grows as the blade ignites). Brightness is unaffected by this, so it only changes reach - but a larger radius evicts more of the map's own lights
LightsaberLightRadius=4.0
; Multiplier on the lightsaber light colour. 1.0 uses the blade colour as authored
LightsaberLightIntensity=1.0

[AI]
; How often AI away from a player make a NEW decision, as a multiple of stock. The engine grades every unit by distance to the nearest human and puts anything past 100 units on a two to four second decision interval, which is what standing around looks like at range. 2.0 makes every tier think twice as often; below 1.0 slows them to buy frame time back. No tier is taken below the 0.25s the engine gives units standing next to you. Range 0.25 to 4.0
AIDecisionRate=1.0
; How many AI units may make a NEW decision each simulation turn. 0 keeps the stock 10. The engine services only the most overdue units and re-queues them, while movement and firing run for everyone every turn - so a unit that misses its slot keeps walking and shooting but never re-decides, which is what standing around looks like. Raising this costs frame time and only helps if the budget is actually the constraint, so measure before changing it. Range 10 to 127
AIUpdateBudget=0
; AI spot you at the same range they spot a bot. Stock BF2 doubles its view range for human players. Set 0 for stock
PlayerVisionFairness=1
; AI rank you the same as a bot at equal distance. Stock BF2 ranks you as if you were half as far away. Set 0 for stock
PlayerPriorityFairness=1
; AI stop treating you as extra dangerous while you are aiming at them. OFF by default: it is the one fairness option that makes AI feel unresponsive, since they no longer react to being aimed at. Set 1 to enable
PlayerThreatFairness=0
; AI keep looking for other enemies while fighting you. In stock BF2 an AI tracking you cannot notice anyone else at all. Set 0 for stock
PlayerAwarenessFairness=1

[Controller]
; Enable gamepad / controller support
Enabled=1
; Enable controller rumble / vibration
Rumble=1

[AimAssist]
; Enable controller aim assist
Enabled=0
; Fallback cone angle in degrees when weapon has no AutoAimSize
ConeAngle=30
; Dead zone multiplier for weapon AutoAimSize
TrackingDeadZone=0.5
; Directional friction scale when aiming away from lock
FrictionStrength=3.0
; Auto-tracking ramp rate per second toward locked target
PullStrength=5.0
; Seconds of pushing away to break target lock
LockBreakTime=0.1
; Automatically lock onto first enemy you damage
AutoLockOnHit=1
; Instant correction on first lock frame (0 = ramp only)
SnapStrength=1.0
; Slow stick when crosshair is near any enemy
ProximityFriction=1
; Screen-space radius for proximity slowdown
ProximityFrictionRadius=0.5
; Min friction at dead center (0 = full stop, 1 = none)
ProximityFrictionScale=0.4

[Diagnostic]
; Report how many sound voices this machine actually gets, how many sounds are being dropped for want of one, and watch the mixed output for bursts pinned at full scale. Modtools only
SoundDiagnostic=0
; Log every step of EntityPath branch-region resolution, so a BranchRegion that will not resolve can be traced. Modtools only
BranchRegionDebug=0
; Report how many AI units are getting a decision each turn against how many want one, and the spread of units across LOD tiers. This is what says whether AIUpdateBudget is worth raising. Modtools only
AIUpdateDiag=0
; Log every memory pool growth with the pool name, the heap it was built on and the heap that is live. A captured heap that differs from the live one is the crash MemoryPoolHeapFix repairs
PoolGrowthDiag=0

