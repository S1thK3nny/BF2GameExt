; BF2GameExt.ini - auto-generated by generate_ini.py for v1.2.0
; To regenerate, run python generate_ini.py

[General]
; Master enable/disable switch for BF2GameExt
Enabled=1
; Path to the main extension DLL (relative to proxy)
DLLPath=BF2GameExt.dll

[Features]
; Enable prone stance. Requires data\_lvl_pc\prone.lvl, which is loaded automatically alongside every ingame.lvl read; prone stays off for any mission where that file is missing
Prone=1
; Enable the engine's BFront2.log file logging on retail builds
GameLogging=0
; On the spawn screen, list the vehicles that spawn at the highlighted command post, the way SWBF1 did. Stock BF2 leaves that line blank. Set 0 for stock
SpawnVehicleList=1
; Seconds to retain the last naturally selected HUD target after selection is lost; no hit required. Fade time belongs to the .hud file (0.25 matches the reference). 0 never times out
TargetBarLatchSeconds=0.5
; Draw the HUD and menus at their exact positions instead of rounding each element to a whole pixel. Anything that moves across the screen, such as floating markers and health bars, glides instead of stepping a pixel at a time. Text and icons that come to rest between two pixels look slightly softer. Set 0 for stock
HudSubPixel=1
; Log 'Unable to find sound property' warnings for missing sounds (modtools only)
EnableSoundWarnings=0
; Remove the permanent combat-award buffs. Buffs from officer buff weapons and buff pickups are untouched. The technician's award weapon goes with its passive
DisableAwardBuffs=0
; Remove the combat-award weapons. Set alongside DisableAwardBuffs to disable all nine awards
DisableAwardWeapons=0
; Seconds a player waits to respawn in multiplayer. The game hardcodes 15 there and throws away whatever the mission script asked for, so no map and no host could change it. Anything from 0.1 to 300, decimals allowed. Only the host sets this, everyone else follows.
MPSpawnDelay=15
; Stop AI from shooting dead bodies entirely (overrides DeadBodyShootingAllFactions)
DisableDeadBodyShooting=1
; Let all factions shoot dead bodies, not just Alliance (ignored if DisableDeadBodyShooting=1)
DeadBodyShootingAllFactions=0

[Particles]
; Effects stop dropping out when many are on screen at once, and particles stop switching off for the rest of the session after one bad frame. Turn off only to compare against stock
ParticleFixes=1
; How many particles effects are allowed to show. 0 = stock, 1 = balanced (full density near and mid-range, stock thinning far away, and effects that ask for more than 128 particles get them), 2 = maximum (no thinning with distance at all). Higher costs frame time
ParticleDensity=0

[Lightsaber]
; Extend the visible blade 8% behind its base instead of 4%, matching Classic Collection. Combat reach is unchanged. Set 0 for stock
ExtendedBladeBase=1
; Ignited lightsaber blades give off real light in their own blade colour. Objects can only take 4 dynamic lights at once, so a nearby saber can replace one of a room's own lights. Set 0 for stock
LightsaberIllumination=1
; How far the lightsaber light reaches, in metres at full blade extension (it grows as the blade ignites). Brightness is unaffected by this, so it only changes reach - but a larger radius evicts more of the map's own lights
LightsaberLightRadius=4.0
; Multiplier on the lightsaber light colour. 1.0 uses the blade colour as authored
LightsaberLightIntensity=1.0

[AI]
; How often AI away from a player make a new decision, as a multiple of stock. Distant AI look like they are standing around because stock BF2 only lets them think every two to four seconds. 2.0 makes them think twice as often; below 1.0 slows them down to buy frame time back. AI next to you are unaffected. Range 0.25 to 4.0
AIDecisionRate=1.0
; How many AI may make a new decision each turn. 0 keeps the stock 10. A unit that misses its turn keeps walking and shooting but never picks a new goal, which is what standing around looks like. Raising this costs frame time and only helps if the budget is what is actually holding them back, so check with AIUpdateDiag before changing it. Range 10 to 127
AIUpdateBudget=0
; AI spot you at the same range they spot a bot. Stock BF2 doubles its view range for human players. Set 0 for stock
PlayerVisionFairness=1
; AI rank you the same as a bot at equal distance. Stock BF2 ranks you as if you were half as far away. Set 0 for stock
PlayerPriorityFairness=1
; AI stop treating you as extra dangerous while you are aiming at them. OFF by default: it is the one fairness option that makes AI feel unresponsive, since they no longer react to being aimed at. Set 1 to enable
PlayerThreatFairness=0
; AI soldiers sprint on long runs out of combat. Stock AI only sprint to catch up with a squad leader, so they always run across the map to an objective. A sprint stops at the soldier's energy limit, as a player's does. Set 0 for stock
AISprint=1
; How far from where it is going, in metres, an AI starts a sprint. It stops at half this distance. Range above 0
AISprintDistance=30
; How a squad lines up on its leader: auto (a wedge where there is room, a column where there is not), wedge, file (two abreast), column, line (abreast of the leader) or stock. The squad faces the way it travels, not the way its leader looks. Stock BF2 lets each follower pick its own layout, puts the first two 1.5 m either side of the leader and swings the squad round with the leader's camera. A soldier class that sets SquadFormation in its ODF uses that for its squads instead, even with this set to stock
SquadFormation=auto
; Metres between squad members in formation. Range 1.5 to 10. A class's SquadSpacing ODF key decides for its squads instead
SquadSpacing=3
; Friendlies who start following you on their own join your squad in formation, as if you had ordered them to follow. Stock BF2 has them trail in a loose group instead. Set 0 for stock. A SquadSize ODF key on your class decides instead
SquadAutoFormUp=1
; How many followers a squad takes, counting friendlies who join you on their own while SquadAutoFormUp is on. Stock BF2 stops those at 2 followers in formation. Range 1 to 8. A class's SquadSize ODF key decides for its squads instead
SquadSize=4
; A squad follower that falls more than 10 m behind its place, or gets caught on something for 2 seconds as its squad moves on, finds its way to its leader round obstacles and barriers, as a soldier going anywhere else does, then falls back in. Stock BF2 followers walk straight along the trail their place leaves and get caught on scenery. Set 0 for stock
SquadPathfinding=1
; AI keep looking for other enemies while fighting you. In stock BF2 an AI tracking you cannot notice anyone else at all. Set 0 for stock
PlayerAwarenessFairness=1
; PROTOTYPE, modtools only. Friendly AI flyers fly a formation on your flyer as wingmen, called up from anywhere on the map, and losses are made up as they happen. In the air the squad key calls them up (aimed at a friendly AI flyer, it picks that one if your flight has room), then switches them between forming up and engaging enemies near you, and held for a second breaks the flight off; the comm keys Attack and Defend order them to attack your locked target (or the enemy under your reticule) and to cover you, and the comm key Spotted (F5) switches their formation. A flyer class with Wingman ODF keys has wingmen whatever this says. Set 1 to enable
FlyerWingmen=0
; How many wingmen your flyer takes. Range 0 to 8. A class's WingmanCount or WingmanSlot ODF keys decide for it instead, and a formation shape from the map takes no more than it has slots for
FlyerWingmenCount=3
; Metres between neighbours in the wingmen's vee. Range 8 to 60. The vee is flown when neither your class's WingmanSlot ODF keys nor the map's formation shapes (its WingmanFormation or SquadronFormation keys) give a formation
FlyerWingmenSpacing=25
; No wingmen fly with you until the squad key calls them up; from then on losses are made up. Set 1 to have them called up at every takeoff. A class's WingmanAuto ODF key decides for it instead
FlyerWingmenAuto=0
; When you land, your wingmen land right away where the ground under them is level with yours, else beside you (else they circle overhead, or under a roof are let go), and their pilots get out; a wingman class with WingmanExitOnLand = 0 waits aboard and takes off with you instead. Set 0 to let them go when you land. A class's WingmanLand ODF key decides for it instead
FlyerWingmenLand=1
; Each of your wingmen has a cyan circle on the map and a target bracket on screen, the game's own markers, while it flies with you. Set 0 for none
FlyerWingmenMarkers=1
; In single player the comm keys (F5 to F12) ask the AI for help. Attack and Defend order your squad (the AI following you) after your target or to the place you aim at, or to guard the friendly or place you aim at; a class with CommandAnyFriendly = 1 orders any friendly. Spotted points nearby allies who can see your target at it; Medic, Repair and Ammo bring a squadmate who can give it, else the nearest friendly who can; Pickup brings the nearest AI-driven hover; Backup brings a few nearby allies, who help for 15 seconds. Each key also gets the game's own chat line, marker and shout. In a flyer the wingmen have F5, F11 and F12. Modtools only for now. Set 0 for stock
CommKeyOrders=1
; A wingman with a wall between it and its slot, such as one still outside a hangar you fly into, follows the path you flew instead of flying into the wall, and under a roof your wingmen close up. Set 0 to have them fly straight to their slots
FlyerWingmenTrail=1
; PROTOTYPE, modtools only. AI flyers on the map's flyer paths fly them instead of being placed on the curve: each chases a point about a second ahead along its path. A flyer class's PathFollowerRealFlight ODF key decides for it instead. Set 1 to enable
FlyerRealFlight=0
; With FlyerRealFlight on, an AI flyer the game turns on its attacker chases that flyer for real, steering for where it will be, for 15 s from the last time it was provoked (40 s at most), then flies back onto its paths. Set 0 for the game's own turn, a bend in its path toward where the attacker was
FlyerRealFlightPursuit=1
; With FlyerRealFlight on, AI flyers gather squadrons by the game's own rule (every 5.5 to 8.5 s, the nearest friendlies heading their way, up to the path's MaxSquadSize) in their class's SquadronFormation shapes, and fly them as your wingmen fly. The game's squadrons ride splines, so none form for flyers on real flight. Set 0 for none
FlyerRealFlightSquadrons=1
; PROTOTYPE, modtools only. Every AI flyer the AI steers (not one placed on its path) keeps clear of every other flyer, yours included: it turns away from any it would pass close to in the next 2 s and eases off behind a slower one, and no longer climbs over a flyer ahead. Set 1 to enable
FlyerAvoidance=0

[Controller]
; Enable gamepad / controller support
Enabled=1
; Enable controller rumble / vibration
Rumble=1

[AimAssist]
; Enable controller aim assist
Enabled=0
; Fallback cone angle in degrees when weapon has no AutoAimSize
ConeAngle=30
; Dead zone multiplier for weapon AutoAimSize
TrackingDeadZone=0.5
; Directional friction scale when aiming away from lock
FrictionStrength=3.0
; Auto-tracking ramp rate per second toward locked target
PullStrength=5.0
; Seconds of pushing away to break target lock
LockBreakTime=0.1
; Automatically lock onto first enemy you damage
AutoLockOnHit=1
; Instant correction on first lock frame (0 = ramp only)
SnapStrength=1.0
; Slow stick when crosshair is near any enemy
ProximityFriction=1
; Screen-space radius for proximity slowdown
ProximityFrictionRadius=0.5
; Min friction at dead center (0 = full stop, 1 = none)
ProximityFrictionScale=0.4

[Diagnostic]
; Report how many sound voices this machine actually gets, how many sounds are being dropped for want of one, and watch the mixed output for bursts pinned at full scale
SoundDiagnostic=0
; Log every step of EntityPath branch-region resolution, so a BranchRegion that will not resolve can be traced
BranchRegionDebug=0
; Print a budget of the content this map actually loaded, against the limits the engine imposes, every N seconds. 0 is off; 30 is a sensible value. Reports effect classes used out of 256 - a ceiling worth watching, because the engine neither warns nor clamps when it fills, it simply hangs. Counted two independent ways so a wrong reading shows up as a disagreement rather than as a confident wrong number. Also callable from a mission script as GameExtContentCensus()
ContentCensus=0
; List every entity class the map loaded by ODF name and base class, once per level load rather than every tick. Turns the census from a count into an inventory, which is what answers "what did I actually put in this map". Needs ContentCensus to be on, and names are only stored on the modtools build
ContentCensusNames=0
; Report how many AI units are getting a decision each turn against how many want one, and the spread of units across LOD tiers. This is what says whether AIUpdateBudget is worth raising
AIUpdateDiag=0
; Log every memory pool growth with the pool name, the heap it was built on and the heap that is live. A captured heap that differs from the live one is the crash the pool heap fix repairs
PoolGrowthDiag=0
; For the walker you drive, log each step of each foot: how far it came down, the biggest drop in a single update and whether BF2 counted the landing. The stomp effect, footstep sound and StepShake come from that count. StompDetectionType 1 counts a step only after a fast enough drop: 3 m/s with WalkerStompFix, otherwise more than 0.1 m in one update
WalkerFootDiag=0

[Fixes]
; Let explosions push bodies that break into chunks, instead of dropping them where they stood
ChunkPushFix=1
; Fix foliage-update crash at very high FOVs (PrismaticFlower's fix)
PropGeneratorLoopFix=1
; Raise the SkyObjectClass instance limit (PrismaticFlower's fix)
SkyObjectLimit=1
; Let lightsabers block other lightsabers from any direction. In stock BF2 a saber block only registers while you happen to be aiming at the centre of the map. Set 0 for stock
SaberBlockFix=1
; Make EntityPath branch regions work; in stock BF2 they never trigger at all. Name the region "entitypathbranch <id>" and write BranchRegion("<id>") in the path node. Set 0 for stock
BranchRegionFix=1
; Walkers with StompDetectionType 1 land their steps at any frame rate. Stock BF2 needs a foot to drop more than 0.1 m in a single frame, so the higher the frame rate, the fewer steps play their stomp effect and footstep sound: at 60 fps most of an AT-TE's walking steps never landed. The fix tests the foot's speed instead, 3 m/s, which is the stock test at 30 fps. Set 0 for stock
WalkerStompFix=1
; Impact sounds play below world height 0. On a map with no water, anything happening under Y=0 was silent. Maps that do have water still go quiet under the surface. Set 0 for stock
ImpactSoundWaterFix=1
; Re-resolve terrain detail/white textures each map (fixes playlist crash; PrismaticFlower's fix)
TerrainTextureFix=1
; Shots leave the barrel instead of the soldier's head, and land on the crosshair at every range. Stock BF2 drifts its own shots off the crosshair past about 65 units, wider the further you shoot. Set 0 for stock
BarrelFireOriginFix=1
; Clamp blur effect downsize resolution to 512px at high resolutions (PrismaticFlower's fix)
BlurDownsizeClamp=1
; Replace the broken Print Screen handler on retail builds (PrismaticFlower's fix)
ScreenshotFix=1
; Restore fatal-error dialogs on retail builds via a template in BF2GameExt.dll (PrismaticFlower's fix)
ErrorDialogFix=1
; EXPERIMENTAL: initialize the DLC mission list when launching a mission from the commandline (PrismaticFlower's fix; not yet working on retail, keep off)
DLCMissionInitFix=0
; Cannon weapons can hold their projectile's TrailEffect at an animated soldier bone before firing. Set HeldOrdnanceEffectBone in the weapon ODF
HeldOrdnanceEffect=1
; Let droidekas play their death animation (death01) instead of exploding instantly; banks without one are unaffected
DroidekaDeathAnimation=1
; HUD widescreen reticle vertical alignment: -1 auto (scales with aspect ratio), 0 to disable, or a manual strength 0..1 (full letterbox undo at 1)
ReticleCorrection=-1
; Two mods that each add HUD icons for their custom weapons used to cancel out when both were loaded, leaving a stray second icon beside the right one. Each mod's icons now work with the others present
WeaponIconFix=1
; Flyers keep full throttle and full roll while you hold both. Stock BF2 reads the throttle and the roll as one stick, the rule that stops soldiers running faster diagonally, so holding both scales each down to 71%: the flyer slows and rolls more slowly until you stop rolling. Not yet tested online. Set 0 for stock
FlyerRollThrottleFix=1

[LimitIncreases]
; Extend RedMemory heap size
HeapExtension=1
; Raise SoundParameterized layer limit
SoundLayerLimit=1
; Raise DLC / addon mission limit
DLCMissionLimit=1
; Raise global sound limit
SoundLimit=1
; Raise entity / object pool limit
ObjectLimitIncrease=1
; Raise high-resolution animation limit
HighResAnimLimit=1
; Raise the tick that reads the keyboard, runs voice chat and takes in network packets from 30 Hz to 120 Hz (the simulation tick, send rate and packet count are untouched)
NetworkTimerIncrease=1
; Extend matrix / item pool size
MatrixPoolIncrease=1
; Increase string pool size
StringPoolIncrease=1
; Raise how many sounds can stream at the same time from 6 to 12. Uses more memory
AudioStreamLimit=1
; Troops and props snap to their blurry low-detail models as soon as a fight gets crowded. Keeps roughly twenty times as many of them at full detail
LODLimitExtension=1
; Explosions more than a short way off were not drawn at all, so distant fighting looked empty. Makes them visible across the map
ExplosionVisibleRadius=1
; Raise Galactic Conquest galaxy-map pathway/particle draw limits (fixes missing pathways and icons with >13 planets)
GCVisualLimits=1
; How many jobs AI squads may hold at once. Vehicle seats, repair points, attack slots and formation positions all come from one pool, and once it fills units stop being given work and the log fills with "List pool is full". 127 is the ceiling and costs 1.6 KB. Set 60 for stock
ReservationPoolSize=127
; How many AI goals may be set at once across all teams (AddAIGoal). The game holds 20, and a map adding more gets "Error too many AI Goals at one time!" and nothing. Up to 64; also lets mission scripts give AI units goals of their own (SetUnitGoal). Modtools only for now. Set 20 for stock
AIGoalLimit=64
; Raise how many tentacles a unit can have from 4 to 9. Bones per tentacle stays capped at 5. Keeps the original offline and multiplayer timing, and fixes extra chains losing their pose when another unit is drawn
TentacleLimit=1
; Raise combo animation names from 30 to 90, distinct animation banks from 16 to 64, bank/weapon maps from 30 to 90 and references from 256 to 768. Includes the storage needed to play the extra animations
ComboAnimIncrease=1
; Soldiers stop dying the moment they go higher than 1000 units, so a map can be built taller. Flyers were never affected. The floor, the fall-speed kill and the horizontal walls are left alone. Costs: a soldier who genuinely escapes upward is never cleaned up. Set 1 to enable
SoldierHeightCeiling=0
; How many sounds may be audible at once. 0 keeps the stock limit of 32, otherwise a count from 33 to 119. Under EAX (5.1/7.1, or any audio mode using hardware) the extra voices come from your sound device and it must have some spare; software mixing needs nothing extra but costs more CPU. Costs 1.4 KB per voice
VoiceLimit=0

